name: EXLLM production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the latest available build or restore the previous release
        type: choice
        options: [deploy, rollback]
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: exllm-production
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ExbotTechnolegy/exllm-new-api' && github.ref == 'refs/heads/exllm-dev'
    environment: exllm-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATION: ${{ inputs.operation }}
      MAINTAINER: ${{ vars.EXAI_RELEASE_MAINTAINER }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Verify operator and operation
        run: |
          set -euo pipefail
          if [[ -z "$MAINTAINER" || "$GITHUB_ACTOR" != "$MAINTAINER" || "$TRIGGERING_ACTOR" != "$MAINTAINER" ]]; then
            echo "The configured EXAI maintainer must dispatch this workflow." >&2
            exit 1
          fi
          case "$OPERATION" in
            deploy|rollback) ;;
            *) exit 1 ;;
          esac
      - name: Fetch verified product artifacts
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/exllm-product-build.yml/runs" \
            -f branch=exllm-dev -f event=push -f status=success -F per_page=100 \
            --jq '.workflow_runs[] | [.run_number, .id, .head_sha] | @tsv' | sort -k1,1nr)
          while IFS=$'\t' read -r _ run_id sha; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || continue
            artifact="exllm-product-$sha"
            available=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              -f name="$artifact" --jq 'any(.artifacts[]; .expired == false and .size_in_bytes > 0)')
            [[ "$available" == true ]] || continue
            branch_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...exllm-dev" --jq '.status')
            [[ "$branch_status" == ahead || "$branch_status" == identical ]] || continue

            candidate=$(mktemp -d "$RUNNER_TEMP/exllm-candidate.XXXXXX")
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$candidate" ||
               [[ ! -s "$candidate/new-api-image-linux-amd64.tar.gz" ||
                  ! -s "$candidate/new-api-linux-amd64.tar.gz" ||
                  ! -s "$candidate/exllm-site.tar.gz" ||
                  ! -s "$candidate/BUILD-METADATA" || ! -s "$candidate/SHA256SUMS" ]]; then
              echo "Build $run_id has no downloadable, complete release package."
              rm -rf -- "$candidate"
              continue
            fi
            (
              cd "$candidate"
              grep -Fx "source_commit=$sha" BUILD-METADATA
              grep -Fx "platform=linux/amd64" BUILD-METADATA
              sha256sum --strict -c SHA256SUMS
            )
            mv -- "$candidate" "$RUNNER_TEMP/exllm-release"
            printf 'RELEASE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
            printf 'Product commit **%s**\n\n[Product build run %s](%s/%s/actions/runs/%s)\n' \
              "$sha" "$run_id" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done <<< "$runs"
          echo "No successful EXLLM product build on exllm-dev has an available release package." >&2
          exit 1
      - name: Invoke restricted production receiver
        env:
          DEPLOY_TARGET: ${{ secrets.EXAI_DEPLOY_TARGET }}
          DEPLOY_KEY: ${{ secrets.EXAI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXAI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_TARGET" =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9][a-zA-Z0-9.-]*$ || -z "$DEPLOY_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo "Configure the dedicated deployment account, key, and pinned host key first." >&2
            exit 1
          fi
          auth=$(mktemp -d)
          trap 'rm -rf -- "$auth"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$auth/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$auth/known_hosts"
          remote=(ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -i "$auth/key"
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o "UserKnownHostsFile=$auth/known_hosts" "$DEPLOY_TARGET")
          if [[ "$OPERATION" == rollback ]]; then
            "${remote[@]}" rollback </dev/null
          else
            tar -C "$RUNNER_TEMP/exllm-release" -cf - BUILD-METADATA SHA256SUMS \
              new-api-image-linux-amd64.tar.gz new-api-linux-amd64.tar.gz exllm-site.tar.gz |
              "${remote[@]}" "deploy $RELEASE_SHA"
          fi
